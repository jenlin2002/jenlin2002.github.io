<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>查字典｜成長學習館</title>
<link rel="icon" href="/app/icon-192.png">
<style>
  :root{ --bg:#F7F3E8; --card:#fffdf6; --ink:#1b3a2f; --soft:#6b6350; --line:#e2d8bf; --gold:#e8b94a; --ok:#2e7d4f; --bad:#c0392b; --blue:#1f3b5c; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
  .wrap{ max-width:900px; margin:0 auto; padding:16px 16px 100px; }
  a{ color:#2f6fb5; }
  .crumb{ font-size:14px; display:flex; gap:14px; flex-wrap:wrap; } .crumb a{ text-decoration:none; color:var(--soft); }
  h1{ margin:6px 0 2px; font-size:28px; }
  .sub{ font-size:13px; color:var(--soft); margin-bottom:12px; }
  .tabs{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .chip{ border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:8px 16px; font:700 15px inherit; font-family:inherit; color:var(--ink); cursor:pointer; }
  .chip.on{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .search{ display:flex; gap:8px; }
  .search input{ flex:1; min-width:0; font-size:20px; padding:10px 14px; border:2px solid var(--line); border-radius:14px; background:#fff; }
  .search input:focus{ outline:none; border-color:var(--gold); }
  .search button{ border:0; border-radius:14px; padding:0 18px; background:var(--ink); color:#fff; font:800 16px inherit; font-family:inherit; cursor:pointer; }
  .hint{ font-size:13px; color:var(--soft); margin:6px 2px; }
  .ent{ background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:14px 16px; margin:14px 0; }
  .ent .hd{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .ent .w{ font:800 32px/1.2 Georgia,"Times New Roman",serif; color:var(--blue); }
  .b{ border:1.5px solid #c9d6e6; background:#eef4fb; color:var(--blue); border-radius:999px; min-width:36px; height:36px; padding:0 10px; font:700 16px/1 system-ui,sans-serif; cursor:pointer; }
  .lv{ padding:2px 10px; border-radius:999px; background:#e8f5ec; color:var(--ok); font-weight:700; font-size:13px; }
  .dk-l{ margin:4px 0; font-size:17px; } .dk-l b{ color:#9a5b13; font-family:Georgia,serif; margin-right:3px; }
  .dk-sub{ margin-top:10px; padding:10px 12px; border-radius:12px; background:#f5efe0; } .dk-hw{ font:700 18px Georgia,serif; color:var(--blue); }
  .note{ color:var(--soft); font-size:14px; }
  .links{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); }
  .links a{ padding:5px 12px; border-radius:999px; background:#fff; border:1.5px solid #d6cdb4; color:#2f4538; font-weight:700; font-size:14px; text-decoration:none; }
  .list{ display:grid; gap:8px; margin-top:12px; }
  .row{ display:flex; align-items:center; gap:10px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:8px 12px; cursor:pointer; }
  .row .e{ font:700 18px Georgia,serif; color:var(--blue); min-width:110px; } .row .z{ flex:1; font-size:14px; color:#4a4436; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .n{ font-size:12px; color:var(--soft); white-space:nowrap; text-align:right; }
  .row .del{ border:1.5px solid #e3a99f; background:#fff; color:var(--bad); border-radius:10px; padding:3px 8px; font:700 13px inherit; font-family:inherit; cursor:pointer; }
  form.edit{ background:#fff4dc; border:1.5px solid #e7c98a; border-radius:18px; padding:12px 14px; margin:14px 0; display:grid; gap:8px; }
  form.edit label{ display:grid; gap:2px; font-size:13px; font-weight:700; color:#6b4a12; }
  form.edit input{ font-size:16px; padding:8px 10px; border:1.5px solid #e2cf9f; border-radius:10px; background:#fff; }
  .tool{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:13px; color:var(--soft); margin-top:10px; }
  .tool select, .tool button{ border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:5px 10px; font:700 13px inherit; font-family:inherit; color:var(--ink); cursor:pointer; }
  .msg{ padding:12px 14px; border-radius:14px; background:#fff4dc; border:1.5px solid #e7c98a; color:#6b4a12; margin:12px 0; }
  footer{ margin-top:30px; font-size:12px; color:var(--soft); }
  @media(max-width:520px){ .row .e{ min-width:84px; font-size:16px; } .ent .w{ font-size:26px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><a href="/">🏠 成長學習館</a><a href="/cards/">📇 我的字卡</a></div>
  <h1>🔍 查字典</h1>
  <div class="sub">輸入英文或中文都可以查。在各單元的文章、講解裡<b>點兩下</b>（電腦）或<b>長按</b>（手機、平板）英文字，也會跳出字典。測驗還沒送出成績時不能查。</div>
  <div class="tabs"><button class="chip on" data-tab="search">🔍 查字典</button><button class="chip" data-tab="hist">🕘 查詢紀錄</button></div>

  <section id="t-search">
    <form class="search" id="sf"><input id="q" type="search" placeholder="例如 neighbor、went、鄰居" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"><button>查</button></form>
    <div class="hint">英文打幾個字母就會列出開頭相同的字；查中文會列出意思裡有這個詞的英文字。</div>
    <div id="out"></div>
  </section>

  <section id="t-hist" hidden>
    <div class="tool"><span id="hwho"></span>
      <select id="hsort"><option value="last">最近查的在前</option><option value="n">查最多次的在前</option><option value="az">A → Z</option></select>
      <button id="hreload">↻ 重新整理</button></div>
    <div id="hmsg"></div>
    <div class="list" id="hlist"></div>
  </section>

  <footer>字典資料：<a href="https://github.com/skywind3000/ECDICT" target="_blank" rel="noopener">ECDICT</a>（MIT 授權，中文已轉成台灣繁體，只收常用的約 3.6 萬字）。更詳細的解釋和例句請點各字下面的劍橋、Yahoo 字典。</footer>
</div>
<script src="/points.js?v=20261118a"></script>
<script src="/dict/dict.js?v=20261118a"></script>
<script src="/cards/cards.js?v=20261117a"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); }, esc = Dict.esc;
  var params = new URLSearchParams(location.search);
  var isZh = function (s) { return /[㐀-鿿]/.test(s); };

  // ---------- 分頁 ----------
  function tab(name) {
    document.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === name); });
    $('#t-search').hidden = name !== 'search'; $('#t-hist').hidden = name !== 'hist';
    if (name === 'hist') loadHist();
    history.replaceState(null, '', location.pathname + location.search + (name === 'hist' ? '#hist' : ''));
  }
  document.querySelectorAll('[data-tab]').forEach(function (b) { b.addEventListener('click', function () { tab(b.dataset.tab); }); });

  // ---------- 查字典 ----------
  function entryCard(e, word, edit) {
    var w = e ? e.w : word, card = Dict.cardOf(e, w);
    card.src = '字典'; card.url = '/dict/?q=' + encodeURIComponent(w);
    var h = '<div class="ent"><div class="hd"><span class="w">' + esc(w) + '</span><button class="b" data-dk-say="' + esc(w) + '" title="發音">🔊</button>' +
      (e && e.lv ? '<span class="lv">' + esc(e.lv) + '</span>' : '') + (window.Cards ? Cards.btn(card, true) : '') + '</div>';
    if (!e) h += '<p class="note">字典裡找不到「' + esc(word) + '」。可以到下面的外部字典查，再把意思貼到「✏️ 自己加字卡」存起來。</p>';
    else {
      if (e.from && e.from !== e.key) h += '<p class="note">「' + esc(e.from) + '」是 <b>' + esc(e.w) + '</b> 的變化形</p>';
      h += Dict.linesHtml(e.t);
      if (e.base) h += '<div class="dk-sub">原形 <a href="?q=' + encodeURIComponent(e.base.w) + '" class="dk-hw">' + esc(e.base.w) + '</a>' + Dict.linesHtml(e.base.t) + '</div>';
    }
    h += '<div class="links">' + Dict.extLinks(w) + '<a href="#" data-edit>✏️ 自己加字卡</a></div></div>';
    h += editForm(card, edit);
    return h;
  }
  // 自己加字卡：中文可以從外部字典複製貼上、自己改；按 ☆ 存成字卡時用表單裡的內容
  function editForm(card, open) {
    return '<form class="edit" id="ef"' + (open ? '' : ' hidden') + '><b>✏️ 自己加字卡</b><span class="note">從劍橋、Yahoo 字典看到的意思、例句，可以複製貼在這裡，改好再按「☆ 存字卡」選分類。</span>' +
      '<label>英文<input name="en" value="' + esc(card.en) + '"></label>' +
      '<label>中文<input name="zh" value="' + esc(card.zh) + '"></label>' +
      '<label>詞性<input name="pos" value="' + esc(card.pos) + '" placeholder="例如 n.、v.、adj."></label>' +
      '<label>例句<input name="ex" placeholder="（可以不填）"></label>' +
      '<label>例句中文<input name="exzh" placeholder="（可以不填）"></label>' +
      '<div>' + (window.Cards ? Cards.btn(card, true).replace('class="ck-star"', 'class="ck-star" id="efStar"') : '') + '</div></form>';
  }
  function bindForm() {
    var f = $('#ef'); if (!f) return;
    var sync = function () {
      var b = $('#efStar'); if (!b) return;
      var c = JSON.parse(b.getAttribute('data-card'));
      ['en', 'zh', 'pos', 'ex', 'exzh'].forEach(function (k) { c[k] = f.elements[k].value.trim(); });
      b.setAttribute('data-card', JSON.stringify(c));
    };
    f.addEventListener('input', sync); f.addEventListener('submit', function (e) { e.preventDefault(); });
    var t = document.querySelector('[data-edit]');
    if (t) t.addEventListener('click', function (e) { e.preventDefault(); f.hidden = !f.hidden; if (!f.hidden) f.elements.zh.focus(); });
  }
  var seq = 0;
  function show(q, opts) {
    opts = opts || {};
    q = String(q || '').trim(); var my = ++seq, out = $('#out');
    if (!q) { out.innerHTML = ''; return; }
    if (isZh(q)) {
      out.innerHTML = '<p class="note">搜尋中…</p>';
      Dict.searchZh(q, 60).then(function (list) {
        if (my !== seq) return;
        out.innerHTML = list.length ? '<p class="note">意思裡有「' + esc(q) + '」的英文字（' + list.length + (list.length >= 60 ? '+' : '') + ' 個，常用的在前）：</p><div class="list">' + list.map(row).join('') + '</div>'
          : '<div class="msg">找不到意思裡有「' + esc(q) + '」的字。換個說法試試看（例如「鄰居」→「鄰」）。</div>';
      }, fail);
      return;
    }
    out.innerHTML = '<p class="note">查字典中…</p>';
    Promise.all([Dict.lookup(q), Dict.prefix(q, 25)]).then(function (r) {
      if (my !== seq) return;
      var e = r[0], more = r[1].filter(function (x) { return !e || x.key !== e.key; });
      out.innerHTML = (e || opts.exact ? entryCard(e, q, opts.edit) : '') +
        (more.length ? '<p class="note">開頭是「' + esc(q.toLowerCase()) + '」的字：</p><div class="list">' + more.map(row).join('') + '</div>' : '') +
        (!e && !more.length ? entryCard(null, q, opts.edit) : '');
      bindForm();
      if (e && opts.record) Dict.record(e, q);
    }, fail);
  }
  function fail() { $('#out').innerHTML = '<div class="msg">字典載入失敗，請檢查網路後再試一次。</div>'; }
  function row(e) { return '<div class="row" data-q="' + esc(e.w) + '"><span class="e">' + esc(e.w) + '</span><span class="z">' + esc(String(e.t || '').split('\n')[0]) + '</span></div>'; }
  var tmr = 0;
  $('#q').addEventListener('input', function () { clearTimeout(tmr); var v = this.value; tmr = setTimeout(function () { show(v); }, 250); });
  $('#sf').addEventListener('submit', function (e) { e.preventDefault(); go($('#q').value); });
  function go(q, edit) {
    $('#q').value = q; tab('search');
    history.replaceState(null, '', '?q=' + encodeURIComponent(q));
    show(q, { exact: true, record: !isZh(q), edit: edit }); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  document.addEventListener('click', function (e) {
    var r = e.target.closest('.row[data-q]');
    if (r && !e.target.closest('button')) go(r.dataset.q);
    var a = e.target.closest('a.dk-hw');
    if (a) { e.preventDefault(); go(a.textContent); }
  });

  // ---------- 查詢紀錄 ----------
  var server = null;
  function merged() {
    var m = {};
    (server || []).forEach(function (x) { m[x.en.toLowerCase()] = Object.assign({}, x); });
    Dict.history().forEach(function (x) {
      var k = x.en.toLowerCase(), o = m[k];
      if (!o) m[k] = Object.assign({}, x);
      else if (!server) { o.n = Math.max(o.n, x.n); }
      else if ((x.last || '') > (o.last || '')) { o.last = x.last; o.zh = o.zh || x.zh; }
    });
    var list = Object.keys(m).map(function (k) { return m[k]; }), s = $('#hsort').value;
    list.sort(function (a, b) {
      if (s === 'n') return (b.n - a.n) || (a.last < b.last ? 1 : -1);
      if (s === 'az') return a.en.toLowerCase() < b.en.toLowerCase() ? -1 : 1;
      return a.last < b.last ? 1 : a.last > b.last ? -1 : 0;
    });
    return list;
  }
  function drawHist() {
    var list = merged();
    $('#hlist').innerHTML = list.length ? list.map(function (x) {
      return '<div class="row" data-q="' + esc(x.en) + '"><span class="e">' + esc(x.en) + '</span><span class="z">' + esc(x.zh || '') + '</span>' +
        '<span class="n">查了 ' + x.n + ' 次<br>' + esc(String(x.last || '').slice(5)) + '</span>' +
        (window.Cards ? Cards.btn({ en: x.en, zh: x.zh || '', src: '字典', url: '/dict/?q=' + encodeURIComponent(x.en) }) : '') +
        '<button class="del" data-del="' + esc(x.en) + '" title="從查詢紀錄刪除">🗑</button></div>';
    }).join('') : '<div class="msg">還沒有查詢紀錄。在文章裡點兩下（或長按）英文字查字典，查過的字就會出現在這裡。</div>';
  }
  function loadHist() {
    var name = Dict.who();
    $('#hwho').textContent = name ? '👤 ' + name + ' 的查詢紀錄' : '（還沒登入：只顯示這台裝置的紀錄）';
    drawHist();
    if (!name || !window.Points || !Points.call) return;
    $('#hmsg').innerHTML = '<p class="note">讀取雲端紀錄中…</p>';
    Dict.flush();
    Points.auth(name, '輸入 PIN，才能看你的查詢紀錄').then(function (tok) {
      if (!tok) throw new Error('auth');
      return Points.call({ action: 'dictlist', name: name, token: tok });
    }).then(function (d) {
      if (d && d.ok) { server = d.words || []; $('#hmsg').innerHTML = '<p class="note">☁️ 手機、平板、電腦查過的字都在這裡（共 ' + server.length + ' 個）。</p>'; }
      else if (d && d.error === 'unknown-action') $('#hmsg').innerHTML = '<div class="msg">查詢紀錄的後端還沒更新（家長把新版 Code.gs 貼到 Apps Script 並部署新版本後，各裝置的紀錄才會同步）。現在只顯示這台裝置的紀錄。</div>';
      else $('#hmsg').innerHTML = '<div class="msg">讀不到雲端紀錄，先顯示這台裝置的紀錄。</div>';
      drawHist();
    }, function () { $('#hmsg').innerHTML = '<div class="msg">讀不到雲端紀錄（沒輸入 PIN 或網路有問題），先顯示這台裝置的紀錄。</div>'; });
  }
  $('#hsort').addEventListener('change', drawHist);
  $('#hreload').addEventListener('click', loadHist);
  document.addEventListener('click', function (e) {
    var d = e.target.closest('[data-del]'); if (!d) return;
    e.stopPropagation();
    var en = d.dataset.del, low = en.toLowerCase();
    if (!confirm('從查詢紀錄刪除「' + en + '」？')) return;
    try { var k = 'dictHist:' + (Dict.who() || '-'); localStorage.setItem(k, JSON.stringify(Dict.history().filter(function (x) { return x.en.toLowerCase() !== low; }))); } catch (er) {}
    if (server) server = server.filter(function (x) { return x.en.toLowerCase() !== low; });
    drawHist();
    var name = Dict.who(), tok = name && Dict.tokenOf(name);
    if (tok && window.Points) Points.call({ action: 'dictdel', name: name, token: tok, words: en }).catch(function () {});
  }, true);

  // ---------- 開頁 ----------
  if (location.hash === '#hist') tab('hist');
  var q0 = params.get('q');
  if (q0) { $('#q').value = q0; show(q0, { exact: true, edit: params.get('edit') === '1' }); }
  else if (location.hash !== '#hist') $('#q').focus();
})();
</script>
</body>
</html>
